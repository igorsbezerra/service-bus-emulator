services:
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqledge
    hostname: sqledge
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    tmpfs:
      - /var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sql-init:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sql-init
    user: root
    depends_on:
      sqledge:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    volumes:
      - ./sql:/init:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/opt/mssql-tools/bin/sqlcmd -S sqledge -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"IF DB_ID('local_messaging') IS NULL CREATE DATABASE [local_messaging];\" -b &&
       /opt/mssql-tools/bin/sqlcmd -S sqledge -U sa -P \"$${MSSQL_SA_PASSWORD}\" -d local_messaging -i /init/init.sql -b"
    restart: "no"

  service-bus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: service-bus
    hostname: service-bus
    user: root
    depends_on:
      sqledge:
        condition: service_healthy
    environment:
      - ACCEPT_EULA=Y
      - SB_USERNAME=${SB_USERNAME}
      - SB_PASSWORD=${SB_PASSWORD}
      - SQL_SERVER=sqledge
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "5672:5672"